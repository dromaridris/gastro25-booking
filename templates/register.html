{% extends "base.html" %}
{% block title %}Register · Gastro Booking{% endblock %}
{% block content %}
<div class="auth-card auth-card--wide">
  <div class="auth-logos">
    <img src="{{ url_for('static', filename='logos/jpmc_logo1.png') }}" alt="JPGMC">
    <img src="{{ url_for('static', filename='logos/jpmc_gastro_logo.jpeg') }}" alt="Dept. of Gastroenterology">
  </div>
  <h1>Request an account</h1>
  <p class="auth-sub">Your account will be <strong>pending</strong> until an Admin or Specialist approves it.</p>

  <form method="POST" class="auth-form">
    <label>Full name
      <input type="text" name="full_name" placeholder="e.g. Dr. Ayesha Khan" required>
    </label>
    <label>Username
      <input type="text" name="username" required>
    </label>
    <label>Password (min. 6 characters)
      <input type="password" name="password" minlength="6" required>
    </label>
    <label>Account type
      <select name="role" required>
        <option value="" disabled selected>Select your role…</option>
        {% for r in roles %}
        <option value="{{ r }}">{{ role_labels[r] }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit" class="btn btn--primary btn--full">Request account</button>
  </form>
  <p class="auth-footnote">Already have an approved account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
