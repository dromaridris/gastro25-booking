{% extends "base.html" %}
{% block title %}Reset password · Gastro & Hepatology{% endblock %}
{% block content %}
<div class="auth-card" style="max-width:420px;margin:40px auto;">
  <h1>Set new password</h1>
  <p class="muted">Use the link provided by Admin/HOD after your reset request was approved.</p>
  <form method="POST" class="auth-form">
    <input type="hidden" name="token" value="{{ token }}">
    <input type="hidden" name="username" value="{{ username }}">
    <label>New password (min 8 characters)
      <input type="password" name="new_password" autocomplete="new-password" required minlength="8">
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_password" autocomplete="new-password" required minlength="8">
    </label>
    <button type="submit" class="btn btn--primary btn--full">Update password</button>
  </form>
  <p class="auth-footnote"><a href="{{ url_for('login') }}">← Back to login</a></p>
</div>
{% endblock %}
