<!-- Unsaved Changes Modal (shared by ercp_report.html and dilatation_report.html) -->
<div id="leaveConfirmModal" class="modal-backdrop no-print" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2>Unsaved Changes</h2>
    </div>
    <p class="muted">You have unsaved changes on this report. Do you want to save them as a draft before leaving?</p>
    <div class="modal-actions">
      <button type="button" class="btn btn--ghost" id="leaveCancelBtn">Cancel</button>
      <button type="button" class="btn btn--outline" id="leaveDiscardBtn">Discard Changes</button>
      <button type="button" class="btn btn--primary" id="leaveSaveBtn">Save Draft &amp; Leave</button>
    </div>
  </div>
</div>
