{% extends "base.html" %}
{% block title %}Change Password · Gastro & Hepatology{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Change Password</h1>
  <p class="auth-sub">Update the password for <strong>{{ current_user.username }}</strong>.</p>
  <form method="POST" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Current Password
      <input type="password" name="current_password" required autofocus>
    </label>
    <label>New Password (min. 8 characters)
      <input type="password" name="new_password" minlength="8" required>
    </label>
    <label>Confirm New Password
      <input type="password" name="confirm_password" minlength="8" required>
    </label>
    <button type="submit" class="btn btn--primary btn--full">Update Password</button>
  </form>
  {% if not session.get('must_change_password') %}
  <p class="auth-footnote"><a href="{{ url_for('dashboard') }}">← Back to dashboard</a></p>
  {% endif %}
</div>
{% endblock %}
