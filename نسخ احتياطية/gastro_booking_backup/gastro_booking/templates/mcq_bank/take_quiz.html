{% extends "base.html" %}
{% block title %}{{ quiz.title }} — Quiz{% endblock %}
{% block content %}
<h1>{{ quiz.title }}</h1>
<p class="muted" id="quiz-progress">Loading {{ items_count }} question(s)…</p>
<div id="quiz-area"></div>

<script>
const quizId = {{ quiz.id }};
let items = [], idx = 0, answers = [];

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function load() {
  const res = await fetch(`/mcq-bank/api/quiz/${quizId}/items`);
  if (!res.ok) {
    document.getElementById('quiz-area').textContent = 'Unable to load this quiz.';
    return;
  }
  items = await res.json();
  renderCurrent();
}
function renderCurrent() {
  document.getElementById('quiz-progress').textContent = `Question ${idx+1} of ${items.length}`;
  if (idx >= items.length) { submitAll(); return; }
  const q = items[idx].question;
  const opts = q.options.map(o => `
    <button type="button" data-letter="${esc(o.letter)}" class="quiz-opt compact-card" style="display:flex;gap:10px;text-align:left;width:100%;cursor:pointer;margin-bottom:8px;">
      <strong>${esc(o.letter)}</strong><span>${esc(o.text)}</span>
    </button>`).join('');
  document.getElementById('quiz-area').innerHTML = `<div class="compact-card"><p>${esc(q.question_text)}</p><div id="quiz-opts">${opts}</div></div>`;
  document.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.addEventListener('click', () => answer(btn.dataset.letter));
  });
}
function answer(letter) {
  answers.push({content_item_id: items[idx].content_item_id, selected_option: letter});
  idx += 1;
  renderCurrent();
}
async function submitAll() {
  const res = await fetch(`/mcq-bank/api/quiz/${quizId}/submit`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({answers}),
  });
  const result = await res.json();
  document.getElementById('quiz-progress').textContent = '';
  document.getElementById('quiz-area').innerHTML = `
    <div class="compact-card" style="text-align:center;">
      <h2>Quiz complete</h2>
      <p>${esc(result.correct)} / ${esc(result.total)} correct</p>
      <a class="btn btn--primary" href="{{ url_for('mcqbank_dashboard') }}">Back to dashboard</a>
    </div>`;
}
load();
</script>
{% endblock %}
