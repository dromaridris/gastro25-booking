{% extends "base.html" %}
{% block title %}Forgot password · Gastro & Hepatology{% endblock %}
{% block content %}
<div class="auth-card" style="max-width:420px;margin:40px auto;">
  <h1>Forgot password</h1>
  <p class="muted">Enter your username. Admin or HOD must approve before you receive a one-time reset link.</p>
  <form method="POST" class="auth-form">
    <label>Username
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <button type="submit" class="btn btn--primary btn--full">Request reset</button>
  </form>
  <p class="auth-footnote"><a href="{{ url_for('login') }}">← Back to login</a></p>
</div>
{% endblock %}
