{% extends "base.html" %}
{% block title %}Educational Banner{% endblock %}
{% block content %}
<h2>Educational Banner</h2>
<form method="POST" class="mb-4">
  <input type="hidden" name="toggle" value="1">
  <div class="form-check form-switch">
    <input class="form-check-input" type="checkbox" name="enabled" value="1" id="bannerEnabled" {% if config and config.pharma_banner_enabled %}checked{% endif %}>
    <label class="form-check-label" for="bannerEnabled">Enable banner on dashboard</label>
  </div>
  <button class="btn btn-primary btn-sm mt-2">Save</button>
</form>
<h4>Slides</h4>
<table class="table table-sm mb-4">
  <thead><tr><th>Order</th><th>Title</th><th>Active</th><th></th></tr></thead>
  <tbody>
  {% for slide in slides %}
    <tr>
      <td>{{ slide.sort_order }}</td>
      <td>{{ slide.title }}</td>
      <td>{{ slide.is_active }}</td>
      <td>
        <form method="POST" class="d-inline"><input type="hidden" name="delete_slide" value="1"><input type="hidden" name="slide_id" value="{{ slide.id }}"><button class="btn btn-outline-danger btn-sm">Delete</button></form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="4" class="text-muted">No slides.</td></tr>
  {% endfor %}
  </tbody>
</table>
<form method="POST">
  <input type="hidden" name="add_slide" value="1">
  <div class="row g-2">
    <div class="col-md-3"><input name="title" class="form-control form-control-sm" placeholder="Title" required></div>
    <div class="col-md-4"><input name="body_html" class="form-control form-control-sm" placeholder="Body HTML"></div>
    <div class="col-md-3"><input name="link_url" class="form-control form-control-sm" placeholder="Link URL"></div>
    <div class="col-md-1"><input name="sort_order" type="number" class="form-control form-control-sm" value="0"></div>
    <div class="col-md-1"><button class="btn btn-primary btn-sm">Add</button></div>
  </div>
</form>
{% endblock %}
