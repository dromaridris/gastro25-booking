<!DOCTYPE html>
<html lang="en" data-theme-mode="{{ branding.theme_mode }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block print_title %}Report{% endblock %} — {{ branding.display_title }}</title>
    <link rel="icon" href="{{ favicon_url }}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/print.css') }}">
    <style>{{ theme_css }}{{ print_css }}</style>
    {% block print_extra_head %}{% endblock %}
</head>
<body class="gi-print-body p-4">
    <div class="no-print mb-3 d-flex gap-2 flex-wrap">
        <button type="button" class="btn gi-btn-primary btn-sm" onclick="window.print()">Print</button>
        {% block print_pdf_link %}{% endblock %}
        {% block print_back_link %}{% endblock %}
    </div>

    {% include "branding_integration/_print_header.html" %}

    {% block print_content %}{% endblock %}

    {% include "branding_integration/_print_footer.html" %}
</body>
</html>
