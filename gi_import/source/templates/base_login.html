<!DOCTYPE html>
<html lang="en" data-theme-mode="{{ branding.theme_mode }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Log In — {{ branding.display_title }}{% endblock %}</title>
    <link rel="icon" href="{{ favicon_url }}" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern-ui.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <style>{{ theme_css }}</style>
</head>
<body class="gi-login-page">
    {% include "branding_integration/_splash.html" %}
    <div class="gi-login-backdrop"></div>
    <main class="gi-login-main container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <footer class="gi-login-footer text-center py-3">
        <div class="small gi-footer-powered">Powered by {{ platform.name }}</div>
        <a href="{{ url_for('branding.about') }}">
            <img src="{{ platform_logo_url }}" alt="{{ platform.name }}" class="gi-platform-logo" height="20">
        </a>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/branding-ui.js') }}"></script>
</body>
</html>
