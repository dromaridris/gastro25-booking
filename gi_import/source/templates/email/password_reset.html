{% extends "email/base.html" %}
{% block email_body %}
<h1 style="font-size:20px;color:{{ branding.primary_color }};margin:0 0 12px;">Password Reset</h1>
<p>Hello {{ user_name }},</p>
<p>We received a request to reset your password for {{ branding.hospital_name }}.</p>
<p><a href="{{ reset_url }}" style="display:inline-block;padding:12px 20px;background:{{ branding.primary_color }};color:#ffffff;text-decoration:none;border-radius:4px;">Reset Password</a></p>
<p style="color:#5c6b7a;font-size:13px;">If you did not request this, please ignore this email.</p>
{% endblock %}
